name: Build CAPEX Reporting Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Verify files exist
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Files in current dir:"
          Get-ChildItem -Path "." -Depth 1 | Select-Object Name
          Write-Host "Checking spec file:"
          Test-Path "build-scripts/CAPEX_Reporting_Tool.spec"
        shell: powershell
      
      - name: Build Windows executable
        run: |
          Write-Host "Starting PyInstaller build..."
          pyinstaller build-scripts/CAPEX_Reporting_Tool.spec -v 2>&1
          Write-Host "PyInstaller completed with exit code: $LASTEXITCODE"
          Write-Host "Checking for dist folder..."
          if (Test-Path "dist") {
            Write-Host "dist folder exists!"
            Get-ChildItem -Path "dist" -Recurse | Select-Object FullName
          } else {
            Write-Host "ERROR: dist folder was not created"
            if (Test-Path "build") {
              Write-Host "build folder exists, contents:"
              Get-ChildItem -Path "build" -Recurse
            }
          }
        shell: powershell
      
      - name: Debug - List dist folder contents
        run: |
          Write-Host "Contents of dist folder:"
          Get-ChildItem -Path "dist" -Recurse | Select-Object FullName
        shell: powershell
        
      - name: Create Windows ZIP
        run: |
          # Find the actual build output folder
          $distItems = Get-ChildItem -Path "dist" -Directory
          Write-Host "Found items in dist: $($distItems.Name)"
          
          foreach ($item in $distItems) {
            if ($item.Name -match "CAPEX" -or $item.Name -match "capex") {
              $source = $item.FullName
              Write-Host "Using source: $source"
              Compress-Archive -Path $source -DestinationPath "CAPEX_Reporting_Tool_Windows.zip" -Force
              Write-Host "ZIP created successfully"
              exit 0
            }
          }
          
          Write-Host "ERROR: Could not find CAPEX folder in dist"
          exit 1
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: CAPEX_Reporting_Tool_Windows.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      
      - name: Verify files exist
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in current dir:"
          ls -la | head -20
          echo "Checking spec file:"
          test -f build-scripts/CAPEX_Reporting_Tool.spec && echo "Spec file exists" || echo "Spec file NOT found"
      
      - name: Build macOS app
        run: |
          echo "Starting PyInstaller build..."
          pyinstaller build-scripts/CAPEX_Reporting_Tool.spec -v 2>&1 || true
          echo "Checking for dist folder..."
          if [ -d "dist" ]; then
            echo "dist folder exists!"
            ls -R dist
          else
            echo "ERROR: dist folder was not created"
            if [ -d "build" ]; then
              echo "build folder exists"
              ls -R build
            fi
          fi
      
      - name: Debug - List dist folder
        run: ls -R dist
        
      - name: Create macOS DMG
        run: |
          if [ -d "dist/CAPEX_Reporting_Tool.app" ]; then
            hdiutil create -volname "CAPEX Reporting Tool" -srcfolder dist/CAPEX_Reporting_Tool.app -ov -format UDZO "CAPEX_Reporting_Tool_macOS.dmg"
            echo "DMG created successfully"
          else
            echo "ERROR: App bundle not found at dist/CAPEX_Reporting_Tool.app"
            exit 1
          fi
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build
          path: CAPEX_Reporting_Tool_macOS.dmg
          retention-days: 30
name: Build CAPEX Reporting Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Build Windows executable
        run: pyinstaller build-scripts/CAPEX_Reporting_Tool.spec
      
      - name: Debug - List dist folder
        run: ls -R dist
        
      - name: Create Windows ZIP
        run: |
          $source = "dist\CAPEX_Reporting_Tool"
          $destination = "CAPEX_Reporting_Tool_Windows.zip"
          if (Test-Path $source) {
            Compress-Archive -Path $source -DestinationPath $destination -Force
            Write-Host "ZIP created successfully"
          } else {
            Write-Host "ERROR: Source path does not exist: $source"
            exit 1
          }
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: CAPEX_Reporting_Tool_Windows.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      
      - name: Build macOS app
        run: pyinstaller build-scripts/CAPEX_Reporting_Tool.spec --onedir
      
      - name: Debug - List dist folder
        run: ls -R dist
        
      - name: Create macOS DMG
        run: |
          if [ -d "dist/CAPEX_Reporting_Tool.app" ]; then
            hdiutil create -volname "CAPEX Reporting Tool" -srcfolder dist/CAPEX_Reporting_Tool.app -ov -format UDZO "CAPEX_Reporting_Tool_macOS.dmg"
            echo "DMG created successfully"
          else
            echo "ERROR: App bundle not found at dist/CAPEX_Reporting_Tool.app"
            exit 1
          fi
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build
          path: CAPEX_Reporting_Tool_macOS.dmg
          retention-days: 30
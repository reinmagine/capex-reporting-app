name: Build CAPEX Reporting Tool

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Build Windows executable
        run: |
          pyinstaller build-scripts/CAPEX_Reporting_Tool.spec -v
        shell: powershell
      
      - name: Debug - List dist folder contents
        run: |
          Write-Host "Contents of dist folder:"
          Get-ChildItem -Path "dist" -Recurse | Select-Object FullName
        shell: powershell
        
      - name: Create Windows ZIP
        run: |
          # Find the actual build output folder
          $distItems = Get-ChildItem -Path "dist" -Directory
          Write-Host "Found items in dist: $($distItems.Name)"
          
          foreach ($item in $distItems) {
            if ($item.Name -match "CAPEX" -or $item.Name -match "capex") {
              $source = $item.FullName
              Write-Host "Using source: $source"
              Compress-Archive -Path $source -DestinationPath "CAPEX_Reporting_Tool_Windows.zip" -Force
              Write-Host "ZIP created successfully"
              exit 0
            }
          }
          
          Write-Host "ERROR: Could not find CAPEX folder in dist"
          exit 1
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: CAPEX_Reporting_Tool_Windows.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      
      - name: Build macOS app
        run: |
          pyinstaller build-scripts/CAPEX_Reporting_Tool.spec -v
      
      - name: Debug - List dist folder
        run: ls -R dist
        
      - name: Create macOS DMG
        run: |
          if [ -d "dist/CAPEX_Reporting_Tool.app" ]; then
            hdiutil create -volname "CAPEX Reporting Tool" -srcfolder dist/CAPEX_Reporting_Tool.app -ov -format UDZO "CAPEX_Reporting_Tool_macOS.dmg"
            echo "DMG created successfully"
          else
            echo "ERROR: App bundle not found at dist/CAPEX_Reporting_Tool.app"
            exit 1
          fi
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Build
          path: CAPEX_Reporting_Tool_macOS.dmg
          retention-days: 30